<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Admin Panel</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
    h2 { margin-top: 0; color: #1e293b; text-align: center; }
    label { font-weight: bold; font-size: 14px; color: #334155; display: block; margin: 15px 0 5px; }
    label span { color: #dc2626; }
    input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; outline: none; background: white; }
    input:focus, select:focus { border-color: #2563eb; }
    input:disabled, select:disabled { background: #f1f5f9; cursor: not-allowed; border-color: #e2e8f0; }
    
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .btn-save { background: #2563eb; color: white; }
    .btn-fetch { background: #0f766e; color: white; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    
    .status { margin-top: 15px; font-weight: bold; text-align: center; font-size: 14px; line-height: 1.4; }
    .success { color: #16a34a; }
    .error { color: #dc2626; }

    .current-box {
      margin-top: 20px; padding: 15px; background: #f1f5f9; border-left: 4px solid #0f766e;
      border-radius: 6px; font-size: 13px; color: #1e293b; display: none; word-break: break-all;
    }
    .current-box h4 { margin: 0 0 10px 0; color: #0f766e; font-size: 14px; }
    .training-item { margin-bottom: 0; padding-bottom: 0; }
    .note { font-size: 11px; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>⚙️ CSC Attendance Admin</h2>

    <form id="adminForm" onsubmit="event.preventDefault(); updateConfig();">
      <label for="token">GitHub Personal Access Token (PAT): <span>*</span></label>
      <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx" required>

      <label for="trainingSelect">Select Training: <span>*</span></label>
      <select id="trainingSelect" onchange="handleTrainingChange()" required>
        <option value="" disabled selected>-- Select Training --</option>
        <option value="labour_ekyc">1. Labour eKYC Training</option>
        <option value="wifi_choupal">2. WiFi Choupal Training</option>
      </select>

      <label for="formUrl">Google Form Embed URL: <span>*</span></label>
      <input type="url" id="formUrl" placeholder="https://docs.google.com/forms/d/e/.../viewform?embedded=true" disabled required>
      <div class="note">Link must contain 'docs.google.com/forms' and 'embedded=true'</div>

      <label for="password">New Password (6 Digits): <span>*</span></label>
      <input type="text" id="password" maxlength="6" pattern="\d{6}" placeholder="123456" disabled required>

      <label for="startTime">Start Date & Time (IST): <span>*</span></label>
      <input type="datetime-local" id="startTime" onchange="handleStartTimeChange()" disabled required>
      <div class="note">Abhi ke samay ke baad ka samay chunein</div>

      <label for="expiry">Expiry Date & Time (IST): <span>*</span></label>
      <input type="datetime-local" id="expiry" disabled required>
      <div class="note">Start Time ke baad ka samay chunein</div>

      <div class="btn-group">
        <button type="button" class="btn-fetch" id="fetchBtn" onclick="fetchCurrentConfig()" disabled>🔍 View Current Settings</button>
        <button type="submit" class="btn-save" id="saveBtn" disabled>💾 Save & Deploy</button>
      </div>
    </form>

    <div id="status" class="status"></div>

    <div id="currentConfigBox" class="current-box">
      <h4>📌 Selected Training Live Settings:</h4>
      <div id="liveContent">Fetching...</div>
    </div>
  </div>

  <script>
    // ================= CONFIGURATION =================
    const GITHUB_USERNAME = "cscchhattisgarh"; 
    const REPO_NAME = "labour-ekcy-training-attendance"; 
    const FILE_PATH = "config.json"; 
    const API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;
    // =================================================

    document.getElementById("token").value = localStorage.getItem("gh_pat") || "";

    // Current time formatted for datetime-local (YYYY-MM-DDTHH:MM)
    function getCurrentDateTimeLocal() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      return `${year}-${month}-${day}T${hours}:${minutes}`;
    }

    async function handleTrainingChange() {
      const selectedValue = document.getElementById("trainingSelect").value;
      const isSelected = !!selectedValue;

      const startTimeInput = document.getElementById("startTime");
      const expiryInput = document.getElementById("expiry");

      document.getElementById("formUrl").disabled = !isSelected;
      document.getElementById("password").disabled = !isSelected;
      startTimeInput.disabled = !isSelected;
      expiryInput.disabled = !isSelected;
      document.getElementById("fetchBtn").disabled = !isSelected;
      document.getElementById("saveBtn").disabled = !isSelected;

      // Inputs default blank rakhein
      document.getElementById("password").value = "";
      startTimeInput.value = "";
      expiryInput.value = "";
      document.getElementById("formUrl").value = "";

      // Min constraint: Start time current time se pehle ka na ho
      const nowFormatted = getCurrentDateTimeLocal();
      startTimeInput.min = nowFormatted;
      expiryInput.min = nowFormatted;

      document.getElementById("currentConfigBox").style.display = "none";
      document.getElementById("status").textContent = "";

      // Auto-populate Form URL
      if (isSelected) {
        const token = document.getElementById("token").value.trim();
        const headers = token ? { "Authorization": `token ${token}` } : {};
        try {
          const res = await fetch(API_URL + '?_=' + Date.now(), { headers });
          if (res.ok) {
            const data = await res.json();
            const decodedText = decodeURIComponent(escape(atob(data.content)));
            const configData = JSON.parse(decodedText);
            
            if (configData.trainings && Array.isArray(configData.trainings)) {
              const matched = configData.trainings.find(t => t.id === selectedValue);
              if (matched && matched.form_url) {
                document.getElementById("formUrl").value = matched.form_url;
              }
            }
          }
        } catch (e) {
          console.error("Auto populate error", e);
        }
      }
    }

    // Dynamic min update for Expiry Input based on Start Time selection
    function handleStartTimeChange() {
      const startVal = document.getElementById("startTime").value;
      const expiryInput = document.getElementById("expiry");
      if (startVal) {
        expiryInput.min = startVal;
        if (expiryInput.value && expiryInput.value <= startVal) {
          expiryInput.value = "";
        }
      }
    }

    function formatISTDisplay(isoStr) {
      if (!isoStr) return "Not Set";
      try {
        const parts = isoStr.split("T");
        if (parts.length < 2) return isoStr;
        const dateParts = parts[0].split("-");
        const timeParts = parts[1].split("+")[0];
        return `${dateParts[1]}/${dateParts[2]}/${dateParts[0]}, ${timeParts} IST`;
      } catch (e) {
        return isoStr;
      }
    }

    async function fetchCurrentConfig() {
      const selectedId = document.getElementById("trainingSelect").value;
      const token = document.getElementById("token").value.trim();
      const status = document.getElementById("status");
      const box = document.getElementById("currentConfigBox");
      const liveContent = document.getElementById("liveContent");
      
      if (!selectedId) {
        status.textContent = "❌ Please select a training first!";
        status.className = "status error";
        return;
      }

      status.textContent = "Fetching Live Config...";
      status.className = "status";

      try {
        const headers = token ? { "Authorization": `token ${token}` } : {};
        const res = await fetch(API_URL + '?_=' + Date.now(), { headers });

        if (res.ok) {
          const getData = await res.json();
          const decodedText = decodeURIComponent(escape(atob(getData.content)));
          const configData = JSON.parse(decodedText);

          let html = "";
          if (configData.trainings && Array.isArray(configData.trainings)) {
            const selectedTraining = configData.trainings.find(t => t.id === selectedId);
            
            if (selectedTraining) {
              html = `<div class="training-item">
                <strong style="color:#0f766e;">📌 ${selectedTraining.name}:</strong><br>
                <b>Password:</b> ${selectedTraining.password || 'Not Set'}<br>
                <b>Start Time:</b> ${formatISTDisplay(selectedTraining.start_time)}<br>
                <b>Expiry:</b> ${formatISTDisplay(selectedTraining.expiry)}<br>
                <b>URL:</b> ${selectedTraining.form_url || 'Not Set'}
              </div>`;
            } else {
              html = "<div>No data found for selected training.</div>";
            }
          }
          liveContent.innerHTML = html;
          box.style.display = "block";
          status.textContent = "✅ Active settings fetched!";
          status.className = "status success";
        } else {
          status.textContent = "❌ Error fetching live config file from API!";
          status.className = "status error";
        }
      } catch (e) {
        status.textContent = "❌ Network Error while fetching live config!";
        status.className = "status error";
      }
    }

    function isValidGoogleFormEmbedUrl(urlStr) {
      if (!urlStr.includes("docs.google.com/forms")) {
        return { valid: false, reason: "Yeh Google Form ki link nahi hai!" };
      }
      if (!urlStr.includes("embedded=true")) {
        return { valid: false, reason: "URL ke aakhri me '?embedded=true' zaroor hona chahiye." };
      }
      return { valid: true };
    }

    async function updateConfig() {
      const token = document.getElementById("token").value.trim();
      const selectedId = document.getElementById("trainingSelect").value;
      const formUrl = document.getElementById("formUrl").value.trim();
      const pwd = document.getElementById("password").value.trim();
      const startVal = document.getElementById("startTime").value;
      const expVal = document.getElementById("expiry").value;
      const status = document.getElementById("status");
      const saveBtn = document.getElementById("saveBtn");

      if (!selectedId) {
        status.textContent = "❌ Kripya pehle Training select karein!";
        status.className = "status error";
        return;
      }

      if (!token || !formUrl || !pwd || !startVal || !expVal) {
        status.textContent = "❌ Kripya sabhi mandatory fields bharein!";
        status.className = "status error";
        return;
      }

      const formCheck = isValidGoogleFormEmbedUrl(formUrl);
      if (!formCheck.valid) {
        status.textContent = "❌ Galat Form URL! " + formCheck.reason;
        status.className = "status error";
        return;
      }

      if (!/^\d{6}$/.test(pwd)) {
        status.textContent = "❌ Password keval 6 numeric digits ka hona chahiye!";
        status.className = "status error";
        return;
      }

      // Time Strict Validation Logic
      const now = new Date();
      const formattedStart = `${startVal}:00+05:30`;
      const formattedExpiry = `${expVal}:00+05:30`;
      const startDateObj = new Date(formattedStart);
      const expiryDateObj = new Date(formattedExpiry);

      // Check 1: Start Time future ka hona chahiye
      if (startDateObj < now) {
        status.textContent = "❌ Start Date & Time abhi ke time ke baad ka hona chahiye!";
        status.className = "status error";
        return;
      }

      // Check 2: Expiry Time Start Time ke baad ka hona chahiye
      if (startDateObj >= expiryDateObj) {
        status.textContent = "❌ Expiry Date/Time Start Date/Time ke baad ka hona chahiye!";
        status.className = "status error";
        return;
      }

      localStorage.setItem("gh_pat", token);
      saveBtn.disabled = true;
      status.textContent = "Fetching current SHA from GitHub API...";
      status.className = "status";

      try {
        const getRes = await fetch(API_URL, {
          headers: { "Authorization": `token ${token}` }
        });

        let sha = "";
        let existingConfig = { trainings: [] };

        if (getRes.ok) {
          const getData = await getRes.json();
          sha = getData.sha;
          const decodedText = decodeURIComponent(escape(atob(getData.content)));
          existingConfig = JSON.parse(decodedText);
        }

        if (!existingConfig.trainings || !Array.isArray(existingConfig.trainings)) {
          existingConfig.trainings = [
            { id: "labour_ekyc", name: "Labour eKYC Training", password: "", start_time: "", expiry: "", form_url: "" },
            { id: "wifi_choupal", name: "WiFi Choupal Training", password: "", start_time: "", expiry: "", form_url: "" }
          ];
        }

        let targetIndex = existingConfig.trainings.findIndex(t => t.id === selectedId);
        if (targetIndex !== -1) {
          existingConfig.trainings[targetIndex].password = pwd;
          existingConfig.trainings[targetIndex].start_time = formattedStart;
          existingConfig.trainings[targetIndex].expiry = formattedExpiry;
          existingConfig.trainings[targetIndex].form_url = formUrl;
        }

        const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(existingConfig, null, 2))));

        status.textContent = "Updating GitHub Repository...";
        const putRes = await fetch(API_URL, {
          method: "PUT",
          headers: {
            "Authorization": `token ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Updated ${selectedId} settings via Admin Panel`,
            content: contentEncoded,
            sha: sha ? sha : undefined
          })
        });

        if (putRes.ok) {
          status.textContent = "✅ Config Successfully Updated!";
          status.className = "status success";

          document.getElementById("password").value = "";
          document.getElementById("startTime").value = "";
          document.getElementById("expiry").value = "";

          fetchCurrentConfig();
        } else {
          const errData = await putRes.json();
          status.textContent = "❌ Error: " + (errData.message || "Failed to update");
          status.className = "status error";
        }
      } catch (err) {
        status.textContent = "❌ Network Error! Connection check karein.";
        status.className = "status error";
      } finally {
        saveBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
