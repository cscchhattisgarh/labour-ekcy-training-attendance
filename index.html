<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSC VLE Training Attendance Form</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; font-family: Arial, sans-serif;
      background: #f2f5f9; min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    .container {
      width: 92%; max-width: 500px; background: #ffffff;
      border-radius: 16px; padding: 30px 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12); text-align: center;
    }
    .logo { font-size: 45px; margin-bottom: 10px; }
    h1 { margin: 5px 0 4px; font-size: 22px; color: #1f2937; }
    h2 { margin: 0 0 18px; font-size: 18px; color: #2563eb; font-weight: 600; }
    .subtitle { font-size: 15px; color: #6b7280; margin-bottom: 25px; line-height: 1.5; }
    label { display: block; text-align: left; font-size: 14px; font-weight: bold; color: #374151; margin-bottom: 8px; }

    .password-wrapper { position: relative; width: 100%; }
    .password-mask {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center; gap: 14px;
      pointer-events: none; font-size: 26px; color: #d1d5db;
    }
    .password-mask span.filled { color: #1f2937; }

    input {
      width: 100%; padding: 14px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 18px; text-align: center;
      outline: none; background: transparent; color: transparent;
      caret-color: #2563eb; letter-spacing: 12px;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.12); }

    button {
      width: 100%; margin-top: 22px; padding: 14px; border: none;
      border-radius: 8px; background: #2563eb; color: white;
      font-size: 17px; font-weight: bold; cursor: pointer;
    }
    button:disabled { background: #93c5fd; cursor: not-allowed; }

    .message { margin-top: 15px; min-height: 22px; font-size: 14px; font-weight: bold; }
    .error { color: #dc2626; }
    .loading { color: #2563eb; }

    #formContainer { display: none; width: 100%; min-height: 100vh; background: #ffffff; }
    #googleForm { width: 100%; height: 100vh; min-height: 800px; border: none; display: block; }
  </style>
</head>

<body>

  <div class="container" id="passwordContainer">
    <div class="logo">📋</div>
    <h1>CSC VLE Attendance For</h1>
    <h2 id="trainingTitle">Training Portal</h2>
    
    <div class="subtitle">
      Attendance Form खोलने के लिए<br>
      कृपया Training Password दर्ज करें।
    </div>

    <form id="passwordForm">
      <label for="password">Password</label>
      
      <div class="password-wrapper">
        <div class="password-mask" id="passwordMask">
          <span>•</span><span>•</span><span>•</span><span>•</span><span>•</span><span>•</span>
        </div>
        
        <input 
          type="password" 
          inputmode="numeric" 
          id="password" 
          maxlength="6" 
          autocomplete="off" 
          oninput="updateMask(this)"
          required
        >
      </div>

      <button type="submit" id="verifyButton">Verify & Continue</button>
    </form>

    <div id="message" class="message"></div>
    <div style="margin-top: 25px; font-size: 12px; color: #9ca3af;">CSC State Office</div>
  </div>

  <div id="formContainer">
    <iframe id="googleForm" src="" frameborder="0">Loading Form...</iframe>
  </div>

  <script>
    const GITHUB_USERNAME = "cscchhattisgarh"; 
    const REPO_NAME = "labour-ekcy-training-attendance"; 
    const FILE_PATH = "config.json"; 
    const API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${FILE_PATH}`;

    const passwordForm = document.getElementById("passwordForm");
    const passwordInput = document.getElementById("password");
    const verifyButton = document.getElementById("verifyButton");
    const message = document.getElementById("message");
    const passwordContainer = document.getElementById("passwordContainer");
    const formContainer = document.getElementById("formContainer");
    const googleForm = document.getElementById("googleForm");

    function updateMask(input) {
      input.value = input.value.replace(/[^0-9]/g, '');
      const len = input.value.length;
      const spans = document.querySelectorAll('#passwordMask span');
      spans.forEach((span, index) => {
        if (index < len) { span.classList.add('filled'); } 
        else { span.classList.remove('filled'); }
      });
    }

    async function getConfig() {
      try {
        // Fetch direct via GitHub API to prevent cache delays
        const res = await fetch(API_URL + '?_=' + Date.now());
        if (!res.ok) return null;
        const data = await res.json();
        const decodedText = decodeURIComponent(escape(atob(data.content)));
        return JSON.parse(decodedText);
      } catch (e) {
        console.error("Config Fetch Error:", e);
        return null;
      }
    }

    function parseISODate(dateStr) {
      if (!dateStr) return null;
      let cleanStr = dateStr.trim();
      // Only append offset if timezone info (+ or Z) is missing
      if (!cleanStr.includes('+') && !cleanStr.includes('Z')) {
        cleanStr += ":00+05:30";
      }
      return new Date(cleanStr);
    }

    passwordForm.addEventListener("submit", async function(e) {
      e.preventDefault();
      const userPwd = passwordInput.value.trim();

      if (!/^\d{6}$/.test(userPwd)) {
        message.textContent = "कृपया केवल 6 अंकों का Numeric Password दर्ज करें।";
        message.className = "message error";
        passwordInput.focus();
        return;
      }

      verifyButton.disabled = true;
      message.textContent = "Verifying Password...";
      message.className = "message loading";

      const config = await getConfig();

      if (!config) {
        verifyButton.disabled = false;
        message.textContent = "Config File Read Error! Admin se sampark karein.";
        message.className = "message error";
        return;
      }

      let matchedTraining = null;

      if (config.trainings && Array.isArray(config.trainings)) {
        matchedTraining = config.trainings.find(t => String(t.password).trim() === userPwd);
      } else if (String(config.password).trim() === userPwd) {
        matchedTraining = {
          name: "Training Portal",
          password: config.password,
          start_time: config.start_time,
          expiry: config.expiry,
          form_url: config.form_url
        };
      }

      if (!matchedTraining) {
        verifyButton.disabled = false;
        message.textContent = "गलत Password! सही Password दर्ज करें।";
        message.className = "message error";
        passwordInput.value = "";
        updateMask(passwordInput);
        passwordInput.focus();
        return;
      }

      const now = new Date();

      // 1. Start Time Check
      if (matchedTraining.start_time) {
        const startTime = parseISODate(matchedTraining.start_time);
        if (startTime && now < startTime) {
          verifyButton.disabled = false;
          message.textContent = "यह Training अभी शुरू नहीं हुई है!";
          message.className = "message error";
          passwordInput.value = "";
          updateMask(passwordInput);
          return;
        }
      }

      // 2. Expiry Time Check
      if (matchedTraining.expiry) {
        const expiryTime = parseISODate(matchedTraining.expiry);
        if (expiryTime && (isNaN(expiryTime.getTime()) || now > expiryTime)) {
          verifyButton.disabled = false;
          message.textContent = "यह Training Password Expire हो चुका है!";
          message.className = "message error";
          passwordInput.value = "";
          updateMask(passwordInput);
          return;
        }
      }

      // Success
      googleForm.src = matchedTraining.form_url;
      passwordContainer.style.display = "none";
      formContainer.style.display = "block";
      document.body.style.background = "#ffffff";
    });
  </script>
</body>
</html>
