<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSC VLE Attendance Portal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
    }
    .container {
      width: 92%; max-width: 500px;
      background: #ffffff;
      border-radius: 16px; padding: 30px 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.12);
      text-align: center;
    }
    .logo { font-size: 45px; margin-bottom: 10px; }
    h1 { margin: 5px 0 8px; font-size: 24px; color: #1f2937; }
    .subtitle { font-size: 15px; color: #6b7280; margin-bottom: 25px; line-height: 1.5; }
    label { display: block; text-align: left; font-size: 14px; font-weight: bold; color: #374151; margin-bottom: 8px; }
    input {
      width: 100%; padding: 14px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 18px; text-align: center; outline: none;
    }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(37,99,235,0.12); }
    button {
      width: 100%; margin-top: 18px; padding: 14px; border: none;
      border-radius: 8px; background: #2563eb; color: white;
      font-size: 17px; font-weight: bold; cursor: pointer;
    }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    .message { margin-top: 15px; min-height: 22px; font-size: 14px; font-weight: bold; }
    .error { color: #dc2626; }
    .loading { color: #2563eb; }
    .footer { margin-top: 25px; font-size: 12px; color: #9ca3af; }
    
    #formContainer { display: none; width: 100%; min-height: 100vh; background: #ffffff; }
    #googleForm { width: 100%; height: 100vh; min-height: 800px; border: none; }
  </style>
</head>
<body>

  <!-- LOGIN CONTAINER -->
  <div class="container" id="passwordContainer">
    <div class="logo">📋</div>
    <h1>CSC VLE Attendance</h1>
    <div class="subtitle">Attendance Form खोलने के लिए<br>कृपया Session Password दर्ज करें।</div>

    <form id="passwordForm">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter Password" autocomplete="off" required>
      <button type="submit" id="verifyButton">Verify & Open Form</button>
    </form>

    <div id="message" class="message"></div>
    <div class="footer">CSC State Office</div>
  </div>

  <!-- GOOGLE FORM CONTAINER -->
  <div id="formContainer">
    <iframe id="googleForm" src="" frameborder="0">Loading Form...</iframe>
  </div>

  <script>
    // Apne Naye Deployment ka Web App Executable URL yahan daalein
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-qwTWhwPqKjfT4SyuGZwo8dnqneYpdArrE_a0ggEp09QAt2OrhSyNrjMXglpCrAyE6w/exec";

    const passwordForm = document.getElementById("passwordForm");
    const passwordInput = document.getElementById("password");
    const verifyButton = document.getElementById("verifyButton");
    const message = document.getElementById("message");
    const passwordContainer = document.getElementById("passwordContainer");
    const formContainer = document.getElementById("formContainer");
    const googleForm = document.getElementById("googleForm");

    passwordForm.addEventListener("submit", function(e) {
      e.preventDefault();
      const pwd = passwordInput.value.trim();
      if (!pwd) return;

      verifyButton.disabled = true;
      verifyButton.textContent = "Verifying...";
      message.textContent = "Password verify किया जा रहा है...";
      message.className = "message loading";

      // Call via JSONP (Bypasses CORS completely)
      window.handleAuthResponse = function(data) {
        if (data.success === true) {
          // Dynamic load form URL from backend
          googleForm.src = data.formUrl;
          
          passwordContainer.style.display = "none";
          formContainer.style.display = "block";
          document.body.style.background = "#ffffff";
        } else {
          verifyButton.disabled = false;
          verifyButton.textContent = "Verify & Open Form";
          message.textContent = "गलत Password! कृपया सही Password दर्ज करें।";
          message.className = "message error";
          passwordInput.value = "";
          passwordInput.focus();
        }

        const oldScript = document.getElementById("jsonpScript");
        if (oldScript) oldScript.remove();
      };

      const script = document.createElement("script");
      script.id = "jsonpScript";
      script.src = `${SCRIPT_URL}?password=${encodeURIComponent(pwd)}&prefix=handleAuthResponse`;
      
      script.onerror = function() {
        verifyButton.disabled = false;
        verifyButton.textContent = "Verify & Open Form";
        message.textContent = "Connection Error! SCRIPT_URL re-check karein.";
        message.className = "message error";
      };

      document.body.appendChild(script);
    });
  </script>
</body>
</html>
